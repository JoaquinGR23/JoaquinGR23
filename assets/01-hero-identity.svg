<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <style>
      /* Pure Dark Void Background */
      .bg { fill: #030712; } 
      .font-main { font-family: system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      
      .title { font-weight: 900; font-size: 96px; fill: #F8FAFC; letter-spacing: 24px; text-anchor: middle; }
      .sub { font-weight: 200; font-size: 18px; fill: #00F5FF; letter-spacing: 16px; text-anchor: middle; }
      
      /* Cinematic Base Transitions (5 Scenes, 25s loop) */
      .scene { transform-origin: 50% 50%; opacity: 0; }
      
      .s1 { animation: s1 25s infinite; }
      .s2 { animation: s2 25s infinite; }
      .s3 { animation: s3 25s infinite; }
      .s4 { animation: s4 25s infinite; }
      .s5 { animation: s5 25s infinite; }

      @keyframes s1 {
        0%, 15% { opacity: 1; filter: blur(0px); transform: scale(1); }
        20%, 99% { opacity: 0; filter: blur(10px); transform: scale(1.05); }
        100% { opacity: 1; filter: blur(0px); transform: scale(1); }
      }
      @keyframes s2 {
        0%, 19% { opacity: 0; filter: blur(0px); transform: scale(1); }
        20%, 35% { opacity: 1; filter: blur(0px); transform: scale(1); }
        40%, 100% { opacity: 0; filter: blur(10px); transform: scale(1.05); }
      }
      @keyframes s3 {
        0%, 39% { opacity: 0; filter: blur(0px); transform: scale(1); }
        40%, 55% { opacity: 1; filter: blur(0px); transform: scale(1); }
        60%, 100% { opacity: 0; filter: blur(10px); transform: scale(1.05); }
      }
      @keyframes s4 {
        0%, 59% { opacity: 0; filter: blur(0px); transform: scale(1); }
        60%, 75% { opacity: 1; filter: blur(0px); transform: scale(1); }
        80%, 100% { opacity: 0; filter: blur(10px); transform: scale(1.05); }
      }
      @keyframes s5 {
        0%, 79% { opacity: 0; filter: blur(0px); transform: scale(1); }
        80%, 95% { opacity: 1; filter: blur(0px); transform: scale(1); }
        100% { opacity: 0; filter: blur(10px); transform: scale(1.05); }
      }

      /* Looping Typewriter Masks for Main Titles - Expanded to full 1200px edge-to-edge width */
      @keyframes t1 {
        0% { width: 0; animation-timing-function: steps(25); }
        5% { width: 1200px; }
        20% { width: 1200px; }
        21%, 100% { width: 0; }
      }
      @keyframes t2 {
        0%, 19% { width: 0; }
        20% { width: 0; animation-timing-function: steps(25); }
        25% { width: 1200px; }
        40% { width: 1200px; }
        41%, 100% { width: 0; }
      }
      @keyframes t3 {
        0%, 39% { width: 0; }
        40% { width: 0; animation-timing-function: steps(25); }
        45% { width: 1200px; }
        60% { width: 1200px; }
        61%, 100% { width: 0; }
      }
      @keyframes t4 {
        0%, 59% { width: 0; }
        60% { width: 0; animation-timing-function: steps(25); }
        65% { width: 1200px; }
        80% { width: 1200px; }
        81%, 100% { width: 0; }
      }
      @keyframes t5 {
        0%, 79% { width: 0; }
        80% { width: 0; animation-timing-function: steps(35); }
        85% { width: 1200px; }
        100% { width: 1200px; }
      }

      .type-1 { animation: t1 25s infinite; }
      .type-2 { animation: t2 25s infinite; }
      .type-3 { animation: t3 25s infinite; }
      .type-4 { animation: t4 25s infinite; }
      .type-5 { animation: t5 25s infinite; }

      /* Typewriter for Bottom Mission Statement - Also expanded to full 1200px */
      @keyframes typeWipe {
        0% { width: 0; }
        100% { width: 1200px; }
      }
      
      .type-line-1 {
        width: 0;
        animation: typeWipe 2s steps(45) 0.5s forwards;
      }
      
      .type-line-2 {
        width: 0;
        animation: typeWipe 2s steps(39) 2.5s forwards;
      }

      @keyframes fadeReveal {
        0% { opacity: 0; transform: translateY(-10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      
      .delayed-reveal {
        opacity: 0;
        animation: fadeReveal 1s ease-out 4.8s forwards;
      }
    </style>
    
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clipping masks for the Main Titles - Rectangles are set to full 1200 width starting from logically far left -->
    <clipPath id="c1"><rect x="-600" y="-200" height="400" class="type-1" /></clipPath>
    <clipPath id="c2"><rect x="-600" y="-100" height="200" class="type-2" /></clipPath>
    <clipPath id="c3"><rect x="-600" y="-100" height="200" class="type-3" /></clipPath>
    <clipPath id="c4"><rect x="-600" y="-100" height="200" class="type-4" /></clipPath>
    <clipPath id="c5"><rect x="-600" y="-100" height="200" class="type-5" /></clipPath>

    <!-- Clipping masks for Mission Statement - Expanded to full 1200 width -->
    <clipPath id="typeClip1"><rect x="-600" y="-30" height="40" class="type-line-1" /></clipPath>
    <clipPath id="typeClip2"><rect x="-600" y="10" height="40" class="type-line-2" /></clipPath>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Typography Sequences -->
  <g transform="translate(600, 420)">
    
    <g class="scene s1" clip-path="url(#c1)">
    <text y="-120" class="font-main sub">Developer</text>
    <text y="-10" class="font-main title" style="font-size:84px; letter-spacing:16px" filter="url(#textGlow)">JOAQUIN</text>
    <text y="80" class="font-main title" style="font-size:84px; letter-spacing:16px" filter="url(#textGlow)">GIMENEZ RUIZ</text>
  </g>
    
    <g class="scene s2" clip-path="url(#c2)">
      <text y="-60" class="font-main sub">AOSP / KERNEL / INTERNALS</text>
      <text y="50" class="font-main title">ANDROID</text>
    </g>

    <g class="scene s3" clip-path="url(#c3)">
      <text y="-60" class="font-main sub">LOW-LEVEL ARCHITECTURE</text>
      <text y="50" class="font-main title" filter="url(#textGlow)">LINUX</text>
    </g>

    <g class="scene s5" clip-path="url(#c5)">
      <text y="-60" class="font-main sub">FULL-STACK DEPLOYMENT</text>
      <text y="50" class="font-main title" font-size="64px" letter-spacing="16px" filter="url(#textGlow)">WEB DEVELOPMENT</text>
    </g>

  </g>

  <!-- Mission Statement -->
  <g transform="translate(600, 740)" text-anchor="middle">
    <!-- Line 1 is masked by typeClip1 -->
    <text y="0" class="font-main" font-weight="200" font-size="24" fill="#F8FAFC" letter-spacing="6px" clip-path="url(#typeClip1)">CONTEXT-AWARE PROACTIVE SYSTEM INTEGRATION.</text>
    
    <!-- Line 2 is masked by typeClip2 -->
    <text y="40" class="font-main" font-weight="200" font-size="24" fill="#00F5FF" letter-spacing="6px" clip-path="url(#typeClip2)">ENGINEERING THE FOUNDATION OF TOMORROW.</text>
    
    <!-- The glowing dot and line fade in after the typing is finished -->
    <g class="delayed-reveal">
      <circle cx="0" cy="80" r="3" fill="#00F5FF" filter="url(#textGlow)" />
      <line x1="0" y1="95" x2="0" y2="160" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    </g>
  </g>
</svg>