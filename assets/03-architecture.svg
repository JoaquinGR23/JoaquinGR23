<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .bg { fill: #030712; }
      .glass { fill: #0B0F19; stroke: rgba(255,255,255,0.05); }
      .font-main { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .font-sys { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

      @keyframes packet { 0% { stroke-dashoffset: 300; } 100% { stroke-dashoffset: 0; } }
      @keyframes pulse { 0%, 100% { fill: rgba(0,245,255,0.1); } 50% { fill: rgba(0,245,255,0.5); filter: drop-shadow(0 0 15px #00F5FF); } }

      .data-line { fill: none; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 12 288; stroke-dashoffset: 300; animation: packet 3s linear infinite; }
      .node-core { animation: pulse 4s infinite; }
      .glow-blue { filter: drop-shadow(0 0 10px #2563EB); }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <text x="120" y="80" class="font-sys" font-size="12" fill="#F8FAFC" letter-spacing="3px">MIS PROYECTOS</text>
  <line x1="120" y1="100" x2="1080" y2="100" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  <rect x="120" y="99" width="60" height="3" fill="#F8FAFC" />

  <rect x="120" y="140" width="960" height="380" rx="8" class="glass" />

  <g transform="translate(120, 140)">
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    </pattern>
    <rect width="960" height="380" fill="url(#grid)" rx="8" />

    <!-- Lineas base -->
    <path d="M 480 190 L 200 190" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
    <path d="M 480 190 L 760 190" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2" />

    <!-- Paquetes de datos -->
    <path d="M 480 190 L 200 190" pathLength="300" class="data-line" stroke="#F59E0B" />
    <path d="M 480 190 L 760 190" pathLength="300" class="data-line" stroke="#2563EB" style="animation-delay: 1s;" />

    <!-- NUCLEO -->
    <circle cx="480" cy="190" r="60" class="node-core" />
    <circle cx="480" cy="190" r="30" fill="#111827" stroke="#00F5FF" stroke-width="3" class="glow-blue" />
    <text x="480" y="195" class="font-main" font-weight="900" font-size="16" fill="#F8FAFC" text-anchor="middle" letter-spacing="1px">Joa</text>

    <!-- NODO 1: Seminario de Lenguaje Python -->
    <circle cx="200" cy="190" r="24" fill="#111827" stroke="#F59E0B" stroke-width="2" />
    <text x="200" y="140" class="font-main" font-weight="700" font-size="14" fill="#F8FAFC" text-anchor="middle">SEMINARIO PYTHON</text>
    <text x="200" y="235" class="font-sys" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">App con datos de la EPH (INDEC)</text>
    <text x="200" y="252" class="font-sys" font-size="11" fill="#F59E0B" text-anchor="middle">Python</text>

    <!-- NODO 2: WebApiAutoress -->
    <circle cx="760" cy="190" r="24" fill="#111827" stroke="#2563EB" stroke-width="2" />
    <text x="760" y="140" class="font-main" font-weight="700" font-size="14" fill="#F8FAFC" text-anchor="middle">WEBAPIAUTORESS</text>
    <text x="760" y="235" class="font-sys" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Proyecto Web API</text>
    <text x="760" y="252" class="font-sys" font-size="11" fill="#2563EB" text-anchor="middle">C#</text>
  </g>
</svg>

