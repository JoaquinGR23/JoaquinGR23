<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 550 1200 160" width="1200" height="160" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .bg { fill: #030712; }
      .font-sys { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>

    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="550" width="1200" height="160" class="bg" />

  <!-- 04 // RECORRIDO -->
  <text x="120" y="580" class="font-sys" font-size="11" fill="#00F5FF" letter-spacing="4px">02 // MI RECORRIDO EN LA UNLP-INFORMATICA</text>
  <line x1="120" y1="600" x2="1080" y2="600" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  <rect x="120" y="599" width="60" height="3" fill="#00F5FF" />

  <!-- Línea de tiempo centrada (100..800 + 150 = 250..950, centro en 600) -->
  <g transform="translate(150, 660)">
    <line x1="100" y1="0" x2="800" y2="0" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
    <line x1="100" y1="0" x2="567" y2="0" stroke="#00F5FF" stroke-width="2" />

    <circle cx="100" cy="0" r="6" fill="#111827" stroke="#00F5FF" stroke-width="2" />
    <text x="100" y="30" class="font-sys" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">1ER AÑO</text>

    <circle cx="333" cy="0" r="6" fill="#111827" stroke="#00F5FF" stroke-width="2" />
    <text x="333" y="30" class="font-sys" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">2DO AÑO</text>

    <circle cx="567" cy="0" r="8" fill="#00F5FF" filter="url(#glowCyan)">
      <animate attributeName="r" values="6; 10; 6" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="567" y="-20" class="font-sys" font-size="10" fill="#00F5FF" text-anchor="middle">PRESENTE</text>
    <text x="567" y="30" class="font-sys" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">3ER AÑO</text>
  </g>
</svg>
